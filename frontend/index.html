<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkillSync · Project ideas for your tech stack</title>
    <meta name="description" content="Pick your tech stack and get three AI-generated project ideas with difficulty, time estimates, learning outcomes, and resources." />
    <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141310" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SkillSync · Project ideas for your tech stack" />
    <meta property="og:description" content="Pick your tech stack and get three AI-generated project ideas with difficulty, time estimates, learning outcomes, and resources." />
    <meta property="og:image" content="/logo.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <!-- Apply the saved or system theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('skillsync_theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
